[project]
name = "brain-mri-preprocessing"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "brainles-preprocessing",
    "nibabel",
    "numpy",
]

[project.optional-dependencies]
prostate = [
    "SimpleITK",
    "pyyaml",
    "pydicom",
]
multimodal = [
    "pandas",
    "requests",
    "pyyaml",
    "pyarrow",      # parquet I/O
]
dev = [
    "pytest",
]
