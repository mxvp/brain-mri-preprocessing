# Paths + series classification. That's it — no preprocessing.

paths:
  nifti_root: data/Prostate-MRI-US-Biopsy-NBIA-manifest_v2_20231020/nifti
  output_root: data/prostate/preprocessed

# Series classification — regex matched (case-insensitive) on SeriesDescription
# read from the dcm2niix JSON sidecar. First match wins.
series:
  t2:    ['t2.*prostate', 't2_spc', 'ax_t2', 't2_tra']
  adc:   ['adc']
  dwi:   ['calc_bval', 'high_b', 'tracew', 'b\\d{3,4}\\b']

# Output: one symlink (or copy) per (patient, modality). Flat dir.
output:
  modalities: [t2, adc, dwi]
  filename_template: "{patient_id}_{modality}.nii.gz"
  copy: false                # true → real copies (~7 GB); false → symlinks
