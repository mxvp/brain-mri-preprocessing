# All paths can be absolute or repo-relative (resolved against the repo root).

paths:
  output_root: data/prostate/preprocessed

workers: 8                # parallel SimpleITK conversions

sources:
  picai:
    enabled: true
    root: <sanitized>/Documents/phd/projects/prostate-dt/data/picai/images
    min_slices: 5
  tcia_biopsy:
    enabled: true
    root: <sanitized>/Documents/phd/projects/prostate-dt/data/Prostate-MRI-US-Biopsy-NBIA-manifest_v2_20231020/nifti
    min_slices: 5
  prostate158:
    enabled: true
    root: <sanitized>/Documents/phd/projects/prostate-dt/data/prostate158
    min_slices: 5
  promise12:
    enabled: true
    root: <sanitized>/Documents/phd/projects/prostate-dt/data/promise12
    min_slices: 5

# Patient-grouped, source-stratified train/val split.
# A patient's volumes always land in the same split — no leakage.
split:
  val_fraction: 0.05
  seed: 0

# Post-organize QC + orientation canonicalization. Run via `python -m prostate qc`.
qc:
  target_orientation: LPS         # rewrite any non-LPS files to LPS

# Canonical PI-CAI preprocessing — resample to uniform voxel grid, then
# center-crop to a fixed prostate-centered matrix. Eliminates per-center FOV
# variance (wide vs narrow native acquisitions all end up at 80×80×60 mm
# physical). Defaults match picai_prep's published config.
preprocess:
  output_root: data/prostate/preprocessed_canonical
  spacing:     [0.5, 0.5, 3.0]    # mm  (x, y, z)
  matrix_size: [160, 160, 20]     # voxels  (x, y, z) = 80×80×60 mm
